name: Testsuite

on:
  push:
    branches:
      # - master
      # - releases/*
      - '**' # cover everything
    tags-ignore:
      - '**'        # but never on tags

jobs:

  build:
    runs-on: ${{ matrix.os }}

    strategy:
      max-parallel: 6
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ['3.13', '3.14']
        install: ['system', 'bundled']

    steps:
    - name: Checkout repository (with libsodium submodule)
      if: matrix.install == 'bundled'
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Checkout repository (with system-wide libsodium)
      if: matrix.install != 'bundled'
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Crypt4GH with system-wide libsodium (macOS)
      if: matrix.os == 'macos-latest' && matrix.install == 'system'
      run: |
        brew install pkg-config libsodium
        export SODIUM_INSTALL=system
        export CFLAGS="$(pkg-config --cflags libsodium)"
        export LDFLAGS="$(pkg-config --libs libsodium)"
        pip install . --no-cache-dir

    - name: Install Crypt4GH with system-wide libsodium (Ubuntu)
      if: matrix.os == 'ubuntu-latest' && matrix.install == 'system'
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libsodium-dev
        export SODIUM_INSTALL=system
        export CFLAGS="$(pkg-config --cflags libsodium)"
        export LDFLAGS="-Wl,--no-as-needed $(pkg-config --libs libsodium)"
        pip install . --no-cache-dir

    - name: Install package (bundled)
      if: matrix.install != 'system'
      run: |
        pip install . --no-cache-dir

    - name: Install bats (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install bash bats-core

    - name: Install bats (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get install -y bats

    - name: Install pytest
      run: pip install pytest

    # Enable passwordless ssh-to-localhost so the remote-transport e2e tests
    # (rsync-over-ssh + ssh find/cat/tar) actually run instead of skipping.
    # Ubuntu only; on macOS these tests skip themselves.
    - name: Enable ssh-to-localhost (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get install -y openssh-server rsync
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519
        cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
        chmod 600 ~/.ssh/authorized_keys
        sudo systemctl start ssh || sudo service ssh start
        for i in $(seq 1 10); do
          ssh -o BatchMode=yes -o ConnectTimeout=4 -o StrictHostKeyChecking=accept-new localhost true && break
          sleep 1
        done
        # Fail loudly if ssh never came up, so the e2e tests are not silently skipped.
        ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new localhost true

    - name: Run unit tests
      run: pytest tests/unit

    - name: Run end-to-end tests
      run: |
        bats tests
